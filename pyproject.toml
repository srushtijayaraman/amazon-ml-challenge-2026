[project]
name = "amazon-ml-challenge-2026"
version = "1.0.0"
description = "Amazon ML Challenge 2026: Business Entity Resolution Solution (0.967915 Leaderboard F0.5)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0.0",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
    "rapidfuzz>=3.8.0",
    "sparse-dot-topn>=1.0.0",
    "unidecode>=1.3.0",
    "joblib>=1.3.0",
    "tqdm>=4.66.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
